<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNSW Class Sniper</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎯 UNSW Class Tracker</h1>
      <p>Real-time push alerts when spots open in myUNSW</p>
    </header>

    <main class="card">
      <!-- Term Selector -->
      <div class="form-group">
        <label for="termSelect">Term</label>
        <select id="termSelect">
          <option value="T1">Term 1</option>
          <option value="T2">Term 2</option>
          <option value="T3" selected>Term 3</option>
        </select>
      </div>

      <!-- Course Autocomplete -->
      <div class="form-group">
        <label for="courseInput">Course Code</label>
        <input type="text" id="courseInput" list="courseList" placeholder="e.g. COMP1511 or ECON1101" autocomplete="off">
        <datalist id="courseList"></datalist>
      </div>

      <!-- Dynamic Class Selection (populated via DevSoc GraphQL) -->
      <div class="form-group">
        <label for="classSelect">Class Component</label>
        <select id="classSelect" disabled>
          <option value="">Select a course first...</option>
        </select>
      </div>

      <button id="trackBtn" class="btn primary">🔔 Track & Enable Alerts</button>
      <div id="statusMsg" class="status"></div>
    </main>

    <section class="card tracking-list">
      <h3>Active Watches</h3>
      <ul id="activeWatches"></ul>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
